<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b1e3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SHAPE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>SHAPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: jovial, confiante, simples — app de treino pessoal
   IDEA: a ficha de treino da academia, virada app de bolso
   PICTURE: a foto animada do exercício e as bolinhas das séries
   COLOUR/TYPE: vinho + rosé sobre creme (claro) ou grafite (escuro); Outfit
   LAYOUT: coluna única para celular, abas embaixo, polegar alcança tudo */
:root{
  --bg:#f7f1ec;--card:#ffffff;--card2:#f3e8e4;--ink:#2a1a1f;--muted:#86707a;--line:#ead9d4;
  --acc:#7b1e3a;--acc-ink:#ffffff;--rose:#d98c9c;--soft:#f6e1e3;--ok:#7b1e3a;--shadow:0 6px 24px rgba(90,30,50,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-mode=light]){--bg:#141113;--card:#1f1a1c;--card2:#2a2326;--ink:#f4ecee;--muted:#a8949b;--line:#352b2f;
  --acc:#c63e68;--acc-ink:#ffffff;--rose:#f0a3b4;--soft:#3a2129;--ok:#e2577f;--shadow:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}
}
:root[data-mode=dark]{--bg:#141113;--card:#1f1a1c;--card2:#2a2326;--ink:#f4ecee;--muted:#a8949b;--line:#352b2f;
  --acc:#c63e68;--acc-ink:#ffffff;--rose:#f0a3b4;--soft:#3a2129;--ok:#e2577f;--shadow:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 Outfit,system-ui,-apple-system,sans-serif;overflow-x:clip;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 120px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;max-width:560px;margin:0 auto}
.logo{font-weight:800;font-size:26px;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.ibtn svg{width:22px;height:22px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
h1{font-size:30px;line-height:1.08;margin:6px 0 4px;font-weight:700;text-wrap:balance}
h2{font-size:20px;margin:22px 0 10px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--acc);font-size:14px;font-weight:500;white-space:nowrap}
:root[data-mode=dark] .chip{color:var(--rose)}
@media (prefers-color-scheme:dark){:root:not([data-mode=light]) .chip{color:var(--rose)}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:600;font-size:17px;width:100%}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.sec{background:var(--card2)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{min-height:44px;font-size:15px;width:auto;padding:0 16px}
.btn:active{transform:scale(.98)}
.badge{width:52px;height:52px;border-radius:16px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:24px;flex:none}
.list{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.li{display:flex;align-items:center;gap:12px}
.th{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#fff;flex:none}
.li .t{font-weight:500;line-height:1.2}
.li .s{font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{font-size:28px;font-weight:700;display:flex;align-items:center;gap:6px}
.stat b svg{width:24px;height:24px;color:var(--acc)}
.stat span{font-size:14px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 12px;font-size:16px}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;font-size:12px;color:var(--muted);border-radius:14px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--acc)}
:root[data-mode=dark] .tabs button.on{color:var(--rose)}
@media (prefers-color-scheme:dark){:root:not([data-mode=light]) .tabs button.on{color:var(--rose)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips button{padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);white-space:nowrap;font-size:15px;min-height:40px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ex{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column}
.ex img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#fff;display:block}
.ex div{padding:10px 12px 12px}
.ex b{font-weight:500;font-size:15px;line-height:1.2;display:block}
.ex span{font-size:13px;color:var(--muted)}
.anim{position:relative;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#fff}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.anim img+img{animation:flip 1.8s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.anim img+img{animation:none;opacity:0}}
/* sessão */
.prog{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .4s}
.dots{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0}
.dot{width:58px;height:58px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--muted);transition:all .2s}
.dot.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.dot.on svg{width:26px;height:26px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:14px;background:var(--card2);font-size:26px;font-weight:600;flex:none}
.stepper input{text-align:center;font-size:24px;font-weight:700;min-height:52px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.strip button{flex:none;padding:8px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:14px;display:flex;gap:6px;align-items:center;min-height:40px}
.strip button span{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip button.cur{border-color:var(--acc)}
.strip button.ok{background:var(--soft)}
.strip svg{width:16px;height:16px;color:var(--ok)}
.done-tag{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
.done-tag svg{width:20px;height:20px}
.big{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-align:center;margin:14px 0}
.hint{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
/* descanso */
.rest{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--acc);color:var(--acc-ink);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(150%);transition:transform .3s}
.rest.show{transform:none;visibility:visible}
.rest:not(.show){visibility:hidden;transition:transform .3s,visibility 0s .3s}
.rest .tm{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;min-width:96px}
.rest button{background:rgba(255,255,255,.18);color:#fff;border-radius:12px;min-height:44px;padding:0 14px;font-weight:600}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,5,8,.45);z-index:40;display:none}
.ov.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));z-index:41;transform:translateY(105%);transition:transform .28s;max-width:600px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--acc)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;transition:transform .3s;font-weight:500;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:70;background:rgba(10,5,8,.5);padding:24px}
.modal.show{display:grid}
.modal .card{max-width:380px;width:100%}
.ed{border:1.5px solid var(--line);border-radius:18px;padding:12px;margin:10px 0;background:var(--card)}
.ed .li{padding:6px 0;border-bottom:1px solid var(--line)}
.ed .li:last-of-type{border-bottom:0}
.mini{width:38px;height:38px;border-radius:10px;background:var(--card2);display:grid;place-items:center;flex:none}
.mini svg{width:18px;height:18px}
.ph{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph input{min-height:42px;padding:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cal span{font-size:12px;color:var(--muted)}
.cal div{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:14px;background:var(--card2)}
.cal div.x{background:var(--acc);color:var(--acc-ink);font-weight:700}
.cal div.e{background:transparent}
.cal div.t{outline:2px solid var(--rose)}
.fig{position:relative;height:180px}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.celebrate{text-align:center;padding:30px 0 10px}
.celebrate .ring{width:110px;height:110px;border-radius:50%;background:var(--acc);display:grid;place-items:center;margin:0 auto 16px;color:#fff;animation:pop .5s ease-out}
.celebrate .ring svg{width:56px;height:56px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.celebrate .ring{animation:none}}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
a{color:var(--acc)}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="logo"><i></i>SHAPE</div>
  <div class="row">
    <button class="ibtn" id="themeBtn" aria-label="Trocar tema"></button>
    <button class="ibtn" id="setBtn" aria-label="Ajustes"></button>
  </div>
</header>
<main class="wrap" id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div class="rest" id="rest">
  <div><div class="small" id="restLbl">Descanso</div><div class="tm" id="restTm">0:00</div></div>
  <div class="sp"></div>
  <button id="restAdd">+15s</button><button id="restSkip">Pular</button>
</div>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card" id="modalBox"></div></div>
<script>
{
const LIB = [{"id": "elev_pelvica_smith", "n": "Elevação pélvica no smith", "g": "Glúteos", "eq": "Smith", "tip": "Costas apoiadas no banco e barra sobre o quadril (use uma almofada). Suba o quadril até o tronco ficar reto e aperte o glúteo no topo.", "img": ["elev_pelvica_smith_0.jpg", "elev_pelvica_smith_1.jpg"]}, {"id": "elev_pelvica_halter", "n": "Elevação pélvica com halter", "g": "Glúteos", "eq": "Halter", "tip": "Deitada no colchonete, joelhos dobrados e halter sobre o quadril. Suba apertando o glúteo e desça devagar.", "img": ["elev_pelvica_halter_0.jpg", "elev_pelvica_halter_1.jpg"]}, {"id": "ponte_unilateral", "n": "Elevação pélvica unilateral", "g": "Glúteos", "eq": "Peso do corpo", "tip": "Uma perna estendida no ar. Suba o quadril empurrando o chão com o calcanhar da perna apoiada.", "img": ["ponte_unilateral_0.jpg", "ponte_unilateral_1.jpg"]}, {"id": "abdutora", "n": "Abdutora", "g": "Glúteos", "eq": "Máquina", "tip": "Abra as pernas contra a resistência, segure 1 segundo aberta e volte controlando.", "img": ["abdutora_0.jpg", "abdutora_1.jpg"]}, {"id": "sumo_halter", "n": "Agachamento sumô com halter", "g": "Glúteos", "eq": "Halter", "tip": "Pés bem afastados e pontas para fora, halter entre as pernas. Desça com o tronco ereto e suba apertando o glúteo.", "img": ["sumo_halter_0.jpg", "sumo_halter_1.jpg"]}, {"id": "step_up", "n": "Subida no banco", "g": "Glúteos", "eq": "Halter", "tip": "Suba no banco empurrando com o calcanhar da perna da frente e desça devagar.", "img": ["step_up_0.jpg", "step_up_1.jpg"]}, {"id": "coice_4apoios", "n": "Coice em 4 apoios", "g": "Glúteos", "eq": "Peso do corpo", "tip": "De quatro no colchonete, leve uma perna para trás e para cima, sem arquear a lombar.", "img": ["coice_4apoios_0.jpg", "coice_4apoios_1.jpg"]}, {"id": "coice_polia", "n": "Coice na polia", "g": "Glúteos", "eq": "Polia", "tip": "Tornozeleira na polia baixa. Leve a perna para trás com o joelho quase reto, sem girar o quadril.", "img": ["coice_polia_0.jpg", "coice_polia_1.jpg"]}, {"id": "terra_sumo", "n": "Levantamento terra sumô", "g": "Glúteos", "eq": "Barra", "tip": "Pés afastados, mãos por dentro das pernas. Suba a barra rente ao corpo com a coluna reta.", "img": ["terra_sumo_0.jpg", "terra_sumo_1.jpg"]}, {"id": "stiff_halter", "n": "Stiff com halteres", "g": "Posterior", "eq": "Halter", "tip": "Joelhos levemente dobrados e coluna reta. Leve o quadril para trás descendo os halteres rente às pernas até sentir alongar atrás da coxa.", "img": ["stiff_halter_0.jpg", "stiff_halter_1.jpg"]}, {"id": "stiff_barra", "n": "Stiff com barra", "g": "Posterior", "eq": "Barra", "tip": "Mesma ideia do stiff com halteres: quadril para trás, barra rente às pernas, coluna sempre reta.", "img": ["stiff_barra_0.jpg", "stiff_barra_1.jpg"]}, {"id": "stiff_smith", "n": "Stiff no smith", "g": "Posterior", "eq": "Smith", "tip": "A barra guiada ajuda no equilíbrio. Quadril para trás, coluna reta, sem descer além do que a flexibilidade permite.", "img": ["stiff_smith_0.jpg", "stiff_smith_1.jpg"]}, {"id": "terra_romeno", "n": "Levantamento terra romeno", "g": "Posterior", "eq": "Barra", "tip": "Parecido com o stiff, com joelhos um pouco mais dobrados. Desça até o meio da canela.", "img": ["terra_romeno_0.jpg", "terra_romeno_1.jpg"]}, {"id": "flexora", "n": "Cadeira flexora", "g": "Posterior", "eq": "Máquina", "tip": "Joelho alinhado com o eixo da máquina. Puxe o rolo para baixo e volte devagar.", "img": ["flexora_0.jpg", "flexora_1.jpg"]}, {"id": "mesa_flexora", "n": "Mesa flexora", "g": "Posterior", "eq": "Máquina", "tip": "Deitada de bruços, quadril colado no banco. Traga os calcanhares em direção ao glúteo.", "img": ["mesa_flexora_0.jpg", "mesa_flexora_1.jpg"]}, {"id": "flexora_pe", "n": "Flexora em pé", "g": "Posterior", "eq": "Máquina", "tip": "Uma perna por vez, tronco apoiado. Dobre o joelho sem mexer o quadril.", "img": ["flexora_pe_0.jpg", "flexora_pe_1.jpg"]}, {"id": "agach_smith", "n": "Agachamento no smith", "g": "Quadríceps", "eq": "Smith", "tip": "Pés um pouco à frente da barra, na largura dos ombros. Desça como se fosse sentar, joelhos na direção das pontas dos pés.", "img": ["agach_smith_0.jpg", "agach_smith_1.jpg"]}, {"id": "agach_halter", "n": "Agachamento com halteres", "g": "Quadríceps", "eq": "Halter", "tip": "Halteres ao lado do corpo. Desça com o peito aberto e o peso nos calcanhares.", "img": ["agach_halter_0.jpg", "agach_halter_1.jpg"]}, {"id": "agach_goblet", "n": "Agachamento goblet", "g": "Quadríceps", "eq": "Halter", "tip": "Segure um halter junto ao peito. Desça entre as pernas mantendo o tronco ereto.", "img": ["agach_goblet_0.jpg", "agach_goblet_1.jpg"]}, {"id": "leg_press", "n": "Leg press", "g": "Quadríceps", "eq": "Máquina", "tip": "Pés na plataforma na largura do quadril (mais altos e afastados pegam mais glúteo). Desça até uns 90° sem tirar a lombar do encosto.", "img": ["leg_press_0.jpg", "leg_press_1.jpg"]}, {"id": "afundo_halter", "n": "Afundo com halteres", "g": "Quadríceps", "eq": "Halter", "tip": "Um passo à frente, desça até os dois joelhos ficarem perto de 90° e volte. Tronco reto. Nas primeiras semanas pode ser sem peso.", "img": ["afundo_halter_0.jpg", "afundo_halter_1.jpg"]}, {"id": "afundo_reverso", "n": "Afundo reverso", "g": "Quadríceps", "eq": "Halter", "tip": "Dê o passo para trás e desça. É mais confortável para os joelhos que o afundo comum.", "img": ["afundo_reverso_0.jpg", "afundo_reverso_1.jpg"]}, {"id": "passada", "n": "Passada (afundo andando)", "g": "Quadríceps", "eq": "Peso do corpo", "tip": "Afundos alternados caminhando para a frente, sempre com o tronco ereto.", "img": ["passada_0.jpg", "passada_1.jpg"]}, {"id": "bulgaro", "n": "Afundo búlgaro", "g": "Quadríceps", "eq": "Halter", "tip": "Pé de trás apoiado no banco. Desça na perna da frente; inclinar o tronco um pouco pega mais glúteo.", "img": ["bulgaro_0.jpg", "bulgaro_1.jpg"]}, {"id": "afundo_smith", "n": "Afundo no smith", "g": "Quadríceps", "eq": "Smith", "tip": "Afundo parado com a ba const prog = ()=>S.programs.find(p=>p.id===S.active)||S.programs[0];
function weekOf(p,dateStr){const d=Math.floor((parse(dateStr||today())-parse(p.start))/864e5);return Math.floor(d/7)+1}
function phaseOf(p,w){const ph=p.phases||[];const ww=Math.min(Math.max(w,1),p.weeks);return ph.find(x=>ww>=x.from&&ww<=x.to)||ph[ph.length-1]||{name:'',sets:3,reps:'12',rest:60,cardio:20}}
function itemEff(p,it,w){const ph=phaseOf(p,w);const exId=(it.alt&&it.alt.ex&&w>=it.alt.week)?it.alt.ex:it.ex;
  return {ex:exId,sets:+(it.sets||ph.sets)||3,reps:it.reps||ph.reps,rest:+(it.rest||ph.rest)||60,note:it.note||''}}
function cardioEff(p,wk,w){const ph=phaseOf(p,w);const c=wk.cardio||{};if(!c.ex)return null;
  const intv=c.intFrom!==''&&c.intFrom!=null&&w>=+c.intFrom;
  return {ex:c.ex,min:+(c.min||ph.cardio)||20,how:intv?'Intervalado: 1 min forte + 2 min leve, repetindo':(c.how||'Ritmo moderado')}}
const todaysWorkout = p=>p.workouts.find(w=>+w.day===new Date().getDay());
const doneToday = wid=>S.history.some(h=>h.date===today()&&h.wid===wid);
function lastLoad(ex){for(let i=S.history.length-1;i>=0;i--){const h=S.history[i];const it=(h.items||[]).find(x=>x.ex===ex&&x.load!==''&&x.load!=null);if(it)return {load:it.load,date:h.date,all:it.done===it.sets}}return null}
function streak(){const p=prog();const days=new Set(S.history.map(h=>h.date));let d=new Date();if(!days.has(iso(d)))d.setDate(d.getDate()-1);let n=0;
  for(let k=0;k<400;k++){const s=iso(d);if(days.has(s))n++;else if(p.workouts.some(w=>+w.day===d.getDay()))break;d.setDate(d.getDate()-1)}return n}
function weekCount(){const m=iso(mondayOf(new Date()));return new Set(S.history.filter(h=>h.date>=m).map(h=>h.date)).size}
const img = (id,k=0)=>EX[id]&&EX[id].img[k]?EX[id].img[k]:'';

const exName = id=>EX[id]?EX[id].n:id;

function renderHoje(){const p=prog();const w=weekOf(p);const ph=phaseOf(p,w);const now=new Date();const wk=todaysWorkout(p);
  let h=`<div class="muted small" style="margin-top:6px">${DOW[now.getDay()]}, ${now.getDate()} de ${MES[now.getMonth()]}</div>

  const wkMon=iso(mondayOf(now));
  if(now.getDay()===+S.weighDay&&!S.weights.some(x=>x.date>=wkMon))
    h+=`<div class="card"><div class="row"><div class="sp"><b>Dia de pesagem</b><div class="muted small">De manhã, em jejum, depois de ir ao banheiro.</div></div></div>

  if(S.session&&S.session.date===today()){const s=S.session;const tot=s.items.length;const d=s.items.filter(i=>i.done.every(Boolean)).length;
    h+=`<div class="card"><div class="row"><div class="badge">${esc(s.letter)}</div><div class="sp"><b>${esc(s.name)}</b><div class="muted small">Em andamento · ${d} de ${tot} exercícios</div></div></div>
    <div class="prog"><i style="width:${tot?d/tot*100:0}%"></i></div><button class="btn pri" id="resume" style="margin-top:12px">Continuar treino</button></div>`}
  else if(wk) h+=workoutCard(p,wk,w,true);
  else h+=`<div class="card"><b style="font-size:20px">Hoje é dia de descanso</b><p class="muted" style="margin:6px 0 0">Descansar também faz o corpo crescer. Uma caminhada leve é bem-vinda.</p></div>`;
  h+=`<div class="stats"><div class="stat"><b>${ic.flame}${streak()}</b><span>dias de sequência</span></div><div class="stat"><b>${weekCount()}<small class="muted" style="font-size:16px;font-weight:500">/${p.workouts.filter(x=>x.day!=='').length}</small></b><span>treinos nesta semana</span></div></div>`;

  if(memOnly)h+=`<div class="hint">Este navegador não está deixando salvar os dados. Abra o SHAPE pelo link normal (fora de abas anônimas) para guardar seu progresso.</div>`;
  $('#view').innerHTML=h;

function workoutCard(p,wk,w,isToday){const c=cardioEff(p,wk,w);const done=doneToday(wk.id);

/* ---------- SESSÃO ---------- */
async function startSession(wid){unlockAudio();
  if(S.session&&S.session.date===today()&&!(await ask('Treino em andamento','Começar outro treino descarta o que está em andamento.','Começar outro')))return;
  const p=prog();const wk=p.workouts.find(x=>x.id===wid);const w=Math.max(1,weekOf(p));
  S.session={date:today(),pid:p.id,wid:wk.id,letter:wk.letter||'•',name:wk.name,i:0,started:Date.now(),
    items:wk.items.map(it=>{const e=itemEff(p,it,w);const ll=lastLoad(e.ex);return {...e,done:Array(e.sets).fill(false),load:ll?ll.load:''}}),
    cardio:(()=>{const c=cardioEff(p,wk,w);return c?{...c,left:c.min*60,end:0,done:false}:null})()};
  save();wake();ui.tab='sessao';render();scrollTo(0,0)}

    ${e.g!=='Cardio'?`<div class="card"><div class="row"><b class="sp">Carga (kg)</b>${ll?`<span class="muted small">da última vez: <b>${esc(ll.load)} kg</b> (${fmtD(ll.date)})</span>`:''}</div>

function swapSheet(it){const g=(EX[it.ex]||{}).g;const opts=LIB.filter(e=>e.g===g&&e.id!==it.ex);

  <div class="list">${opts.map(e=>`<button class="card li" style="margin:0;text-align:left" data-sw="${e.id}">${thumb(e.id)}<div class="sp"><div class="t">${esc(e.n)}</div><div class="s">${esc(e.eq)}</div></div></button>`).join('')}</div>`);

async function finishSession(){const s=S.session;if(!s)return;
  const anyDone=s.items.some(i=>i.done.some(Boolean))||(s.cardio&&s.cardio.done);
  const allDone=s.items.every(i=>i.done.every(Boolean))&&(!s.cardio||s.cardio.done);
  if(!anyDone){const r=await ask('Nenhuma série marcada','Deseja sair sem registrar este treino?','Descartar','Voltar');if(r){S.session=null;save();stopRest();ui.tab='hoje';render()}return}
  if(!allDone&&!(await ask('Finalizar treino?','Ainda há séries sem marcar. O treino será registrado com o que foi feito.','Finalizar','Continuar')))return;
  const c=s.cardio;const cmin=c?Math.round(c.done?(c.min*60-(c.end?Math.max(0,(c.end-Date.now())/1000):c.left))/60||c.min:(c.min*60-c.left)/60):0;
  const rec={date:s.date,wid:s.wid,pid:s.pid,letter:s.letter,name:s.name,dur:Math.round((Date.now()-s.started)/60000),
    items:s.items.map(i=>({ex:i.ex,load:i.load,sets:i.sets,done:i.done.filter(Boolean).length})),cardio:c?{ex:c.ex,min:Math.max(0,cmin)}:null};

let restEnd=0,restTot=0,restI=null,ac=null,wl=null;
function unlockAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){try{if(!ac)return;[0,.28,.56].forEach((t,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=k===2?1040:780;o.connect(g);g.connect(ac.destination);
  const st=ac.currentTime+t;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.35,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+.22);o.start(st);o.stop(st+.24)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startRest(sec){restTot=sec;restEnd=Date.now()+sec*1000;$('#restLbl').textContent='Descanso';$('#rest').classList.add('show');clearInterval(restI);restI=setInterval(tickRest,250);tickRest()}
function tickRest(){const left=(restEnd-Date.now())/1000;$('#restTm').textContent=mmss(left);
  if(left<=0){clearInterval(restI);beep();$('#restLbl').textContent='Bora!';$('#restTm').textContent='Próxima série';setTimeout(()=>{if(restEnd<=Date.now())$('#rest').classList.remove('show')},2500)}}
function stopRest(){clearInterval(restI);restEnd=0;$('#rest').classList.remove('show')}
$('#restAdd').onclick=()=>{if(restEnd<Date.now())restEnd=Date.now();restEnd+=15000;clearInterval(restI);restI=setInterval(tickRest,250);$('#restLbl').textContent='Descanso';tickRest()};
$('#restSkip').onclick=stopRest;
async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){wl=null}}
function relWake(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.session&&ui.tab==='sessao')wake()});
setInterval(()=>{const c=S.session&&S.session.cardio;if(!c||!c.end||ui.tab!=='sessao')return;const left=(c.end-Date.now())/1000;const el=$('#cTm');if(el)el.textContent=mmss(left);
  if(left<=0){c.left=0;c.end=0;c.done=true;save();beep();toast('Cardio concluído!');render()}},500);

  <div class="chips" id="lc" style="margin-top:8px">${['',...GROUPS].map(x=>`<button data-g="${x}" class="${g===x?'on':''}">${x||'Todos'}</button>`).join('')}</div><div class="grid" id="lg"></div>
  <p class="muted small" style="text-align:center;margin-top:20px">Fotos: Free Exercise DB (domínio público)</p>`;
  const draw=()=>{const L=LIB.filter(e=>(!ui.lib.g||e.g===ui.lib.g)&&(!ui.lib.q||norm(e.n).includes(norm(ui.lib.q))));
    $('#lg').innerHTML=L.map(e=>`<button class="ex" data-x="${e.id}"><img src="${esc(e.img[0])}" alt="" loading="lazy"><div><b>${esc(e.n)}</b><span>${esc(e.g)}</span></div></button>`).join('')||'<div class="empty" style="grid-column:1/-1">Nada encontrado.</div>'};
  draw();
  $('#lq').oninput=e=>{ui.lib.q=e.target.value;draw()};
  $('#lc').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;ui.lib.g=b.dataset.g;$('#lc').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw()};
  $('#lg').onclick=e=>{const b=e.target.closest('[data-x]');if(b)exSheet(b.dataset.x)}}
function exSheet(id){const e=EX[id];const p=prog();
  sheet(`<div class="anim">${e.img.map(s=>`<img src="${esc(s)}" alt="Execução de ${esc(e.n)}">`).join('')}</div>
  <div class="row" style="margin-top:12px;flex-wrap:wrap"><span class="chip">${esc(e.g)}</span><span class="chip">${esc(e.eq)}</span></div>
  <h1 style="font-size:26px;margin-top:10px">${esc(e.n)}</h1><p style="margin-top:4px">${esc(e.tip)}</p>
  <h2>Adicionar a um treino</h2><div class="list">${p.workouts.map(w=>`<button class="card li" style="margin:0;text-align:left" data-to="${w.id}"><div class="badge" style="width:40px;height:40px;font-size:17px;border-radius:12px">${esc(w.letter||'•')}</div><div class="sp"><div class="t">${esc(w.name)}</div><div class="s">${esc(p.name)}</div></div>${ic.plus.replace('<svg','<svg width="20" height="20"')}</button>`).join('')}</div>`);
  $('#sheet').querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{const w=p.workouts.find(x=>x.id===b.dataset.to);if(e.g==='Cardio'){w.cardio={...(w.cardio||{}),ex:id}}else w.items.push({ex:id});save();closeSheet();toast('Adicionado ao '+(w.letter?'treino '+w.letter:w.name))})}

/* ---------- PROGRESSO ---------- */
function renderProg(){const W=[...S.weights].sort((a,b)=>a.date<b.date?-1:1);const last=W[W.length-1],first=W[0];
  if(!ui.cal){const d=new Date();ui.cal=[d.getFullYear(),d.getMonth()]}
  const [cy,cm]=ui.cal;const days=new Set(S.history.map(h=>h.date));const f=new Date(cy,cm,1);const off=f.getDay();const nd=new Date(cy,cm+1,0).getDate();
  let cal='';for(let i=0;i<off;i++)cal+='<div class="e"></div>';for(let d=1;d<=nd;d++){const s=iso(new Date(cy,cm,d));cal+=`<div class="${days.has(s)?'x':''} ${s===today()?'t':''}">${d}</div>`}
  const M=[...S.measures].sort((a,b)=>a.date<b.date?-1:1);const lm=M[M.length-1];
  const diff=last&&first&&last!==first?Math.round((last.kg-first.kg)*10)/10:null;
  $('#view').innerHTML=`<h1 style="margin-top:14px">Progresso</h1>
  <div class="card"><div class="row"><div class="sp"><div class="muted small">Peso atual</div><b style="font-size:34px">${last?esc(last.kg)+' kg':'—'}</b>${diff!==null?`<div class="muted small">${diff>0?'+':''}${String(diff).replace('.',',')} kg desde ${fmtD(first.date)}</div>`:''}</div><div class="muted small" style="text-align:right">Pesagem toda<br><b>${DOW[S.weighDay].toLowerCase()}</b></div></div>
  ${W.length>1?'<div class="fig" id="wf" style="margin-top:10px"><svg id="ws"></svg></div>':''}
  <div class="row" style="margin-top:12px"><input type="number" inputmode="decimal" step="0.1" id="pW" placeholder="Peso (kg)"><button class="btn pri sm" id="pS">Salvar</button></div><label class="f">Data</label><input type="date" id="pD" value="${today()}">
  ${W.length?`<details style="margin-top:10px"><summary class="muted small" style="cursor:pointer;min-height:32px">Todas as pesagens</summary>${[...W].reverse().map(x=>`<div class="kv"><span>${fmtD(x.date)}</span><span>${esc(x.kg)} kg <button class="mini" style="display:inline-grid;vertical-align:middle;margin-left:6px;width:32px;height:32px" data-wd="${esc(x.date)}|${esc(x.kg)}" aria-label="Apagar">${ic.x}</button></span></div>`).join('')}</details>`:''}</div>
  <div class="card"><b>Medidas</b> <span class="muted small">— uma vez por mês</span>
  ${lm?`<div class="muted small" style="margin-top:6px">Última (${fmtD(lm.date)}): cintura ${esc(lm.cintura||'—')} · quadril ${esc(lm.quadril||'—')} · coxa ${esc(lm.coxa||'—')} cm</div>`:''}
  <div class="ph" style="margin-top:8px"><div><label class="f">Cintura (cm)</label><input type="number" inputmode="decimal" id="mC"></div><div><label class="f">Quadril (cm)</label><input type="number" inputmode="decimal" id="mQ"></div><div><label class="f">Coxa (cm)</label><input type="number" inputmode="decimal" id="mX"></div></div>
  <button class="btn sec sm" id="mS" style="margin-top:10px">Salvar medidas</button>
  ${M.length>1?`<details style="margin-top:10px"><summary class="muted small" style="cursor:pointer;min-height:32px">Histórico de medidas</summary>${[...M].reverse().map(x=>`<div class="kv"><span>${fmtD(x.date)}</span><span>${esc(x.cintura||'—')} · ${esc(x.quadril||'—')} · ${esc(x.coxa||'—')}</span></div>`).join('')}</details>`:''}</div>
  <div class="card"><div class="row"><button class="mini" id="cP" aria-label="Mês anterior">${ic.back}</button><b class="sp" style="text-align:center;text-transform:capitalize">${MES[cm]} ${cy}</b><button class="mini" id="cN" aria-label="Próximo mês">${ic.next}</button></div>
  <div class="cal" style="margin-top:12px">${DOWS.map(d=>`<span>${d}</span>`).join('')}${cal}</div>
  <div class="row" style="margin-top:12px"><span class="sp muted small">${S.history.length} treinos no total</span><span class="chip">${ic.flame.replace('<svg','<svg width="16" height="16"')}${streak()} dias</span></div></div>
  <h2>Últimos treinos</h2>${S.history.length?[...S.history].reverse().slice(0,12).map(h=>`<div class="card li" style="margin:8px 0"><div class="badge" style="width:42px;height:42px;font-size:18px;border-radius:12px">${esc(h.letter)}</div><div class="sp"><div class="t">${esc(h.name)}</div><div class="s">${fmtD(h.date)} · ${h.dur} min · ${h.items.reduce((a,i)=>a+i.done,0)} séries${h.cardio&&h.cardio.min?' · '+h.cardio.min+' min de cardio':''}</div></div></div>`).join(''):'<div class="empty">Seus treinos concluídos aparecem aqui.</div>'}`;
  $('#pS').onclick=()=>{const v=num($('#pW').value);if(!v)return toast('Digite o peso');S.weights.push({date:$('#pD').value||today(),kg:v});save();toast('Peso salvo');render()};
  $('#view').querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{const [d,k]=b.dataset.wd.split('|');const i=S.weights.findIndex(x=>x.date===d&&String(x.kg)===k);if(i>=0)S.weights.splice(i,1);save();render()});
  $('#mS').onclick=()=>{const m={date:today(),cintura:num($('#mC').value),quadril:num($('#mQ').value),coxa:num($('#mX').value)};if(!m.cintura&&!m.quadril&&!m.coxa)return toast('Preencha ao menos uma medida');S.measures.push(m);save();toast('Medidas salvas');render()};
  $('#cP').onclick=()=>{let [y,m]=ui.cal;m--;if(m<0){m=11;y--}ui.cal=[y,m];render()};
  $('#cN').onclick=()=>{let [y,m]=ui.cal;m++;if(m>11){m=0;y++}ui.cal=[y,m];render()};
  const s=$('#ws');if(s){const draw=()=>{const Wd=s.clientWidth,H=s.clientHeight;if(!Wd)return;const ks=W.map(x=>+x.kg);let lo=Math.min(...ks),hi=Math.max(...ks);if(hi-lo<1){lo-=.5;hi+=.5}
    const px=i=>14+i*(Wd-28)/Math.max(1,W.length-1),py=v=>16+(hi-v)*(H-40)/(hi-lo);const pts=W.map((x,i)=>px(i)+','+py(+x.kg)).join(' ');
    s.innerHTML=`<polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${W.map((x,i)=>`<circle cx="${px(i)}" cy="${py(+x.kg)}" r="4.5" fill="var(--card)" stroke="var(--acc)" stroke-width="2.5"/>`).join('')}
    <text x="${px(0)}" y="${H-4}" font-size="12" fill="var(--muted)">${fmtD(W[0].date)}</text><text x="${px(W.length-1)}" y="${H-4}" font-size="12" fill="var(--muted)" text-anchor="end">${fmtD(W[W.length-1].date)}</text>`};
    const ro=new ResizeObserver(draw);ro.observe(s);draw()}
}

/* ---------- AJUSTES ---------- */
function openSettings(){
  sheet(`<h2 style="margin-top:0">Ajustes</h2>
  <label class="f">Seu nome (para a saudação)</label><input type="text" id="sN" value="${esc(S.name)}" placeholder="Opcional">
  <label class="f">Tema</label><div class="seg" id="sM">${[['auto','Automático'],['light','Claro'],['dark','Escuro']].map(([k,l])=>`<button data-m="${k}" class="${S.mode===k?'on':''}">${l}</button>`).join('')}</div>
  <label class="f">Dia da pesagem</label><select id="sW">${DOW.map((d,k)=>`<option value="${k}" ${+S.weighDay===k?'selected':''}>${d}</option>`).join('')}</select>
  <h2>Backup</h2><p class="muted small" style="margin-top:-6px">Seus dados ficam só neste celular. Copie o backup de vez em quando e guarde (por exemplo, mande para você mesma no WhatsApp).</p>
  <button class="btn sec" id="bC">Copiar backup</button>
  <textarea id="bT" placeholder="Para restaurar, cole aqui o código do backup" style="margin-top:10px"></textarea>
  <button class="btn ghost" id="bR" style="margin-top:8px">Restaurar backup</button>
  <button class="btn ghost" id="bX" style="margin-top:22px;color:var(--acc)">Apagar todos os dados</button>
  <p class="muted small" style="text-align:center;margin-top:16px">Fotos dos exercícios: Free Exercise DB (domínio público).</p>`);
  $('#sN').oninput=e=>{S.name=e.target.value.trim();save()};
  $('#sM').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;S.mode=b.dataset.m;save();applyTheme();$('#sM').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#sW').onchange=e=>{S.weighDay=+e.target.value;save()};
  $('#bC').onclick=async()=>{const code='SHAPE1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#bT').value=code;
    try{await navigator.clipboard.writeText(code);toast('Backup copiado')}catch(e){$('#bT').select();toast('Selecione e copie o código')}};
  $('#bR').onclick=async()=>{const v=$('#bT').value.trim();try{if(!v.startsWith('SHAPE1:'))throw 0;const d=JSON.parse(decodeURIComponent(escape(atob(v.slice(7)))));if(!d.programs)throw 0;
    if(!(await ask('Restaurar backup?','Os dados atuais deste celular serão substituídos pelos do backup.','Restaurar')))return;S=d;save();closeSheet();toast('Backup restaurado');render()}catch(e){toast('Código de backup inválido')}};
  $('#bX').onclick=async()=>{if(await ask('Apagar tudo?','Treinos, histórico, pesos e medidas serão apagados deste celular. O programa padrão volta.','Apagar')){S=seed();save();closeSheet();ui.tab='hoje';render()}};
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
if(S.session&&S.session.date!==today()){/* sessão antiga fica disponível para finalizar */}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
</script>
</body>
</html>
